# Render blueprint for SkillOS.
# One web service (SvelteKit on adapter-node) + one managed PostgreSQL instance.
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: skillos-db
    databaseName: skillos
    user: skillos
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "16"

services:
  - type: web
    name: skillos
    runtime: node
    plan: starter
    region: oregon
    branch: main
    autoDeploy: true
    healthCheckPath: /api/health
    buildCommand: bun install --frozen-lockfile && bun run build
    preDeployCommand: bun run db:migrate
    startCommand: node build/index.js
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      - key: BUN_VERSION
        value: 1.1.38
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: skillos-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: XAI_MODEL
        value: grok-4-fast
      - key: LOG_LEVEL
        value: info
      # Optional: background jobs. Leave unset to run entirely request-driven.
      - key: TRIGGER_SECRET_KEY
        sync: false
      - key: TRIGGER_PROJECT_REF
        sync: false

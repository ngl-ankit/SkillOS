# Render Blueprint for SkillOS
# Free web service + external PostgreSQL

services:
  - type: web
    name: skillos
    runtime: node
    plan: free
    region: oregon
    branch: main
    autoDeploy: true

    healthCheckPath: /api/health

    buildCommand: bun install --frozen-lockfile && bun run build

    startCommand: bun run db:migrate && node build/index.js

    envVars:
      - key: NODE_VERSION
        value: 22.11.0

      - key: BUN_VERSION
        value: 1.1.38

      - key: NODE_ENV
        value: production

      - key: DATABASE_URL
        sync: false

      - key: BETTER_AUTH_SECRET
        generateValue: true

      - key: BETTER_AUTH_URL
        sync: false

      - key: PUBLIC_APP_URL
        sync: false

      - key: XAI_API_KEY
        sync: false

      - key: XAI_MODEL
        value: grok-4-fast

      - key: LOG_LEVEL
        value: info

      - key: TRIGGER_SECRET_KEY
        sync: false

      - key: TRIGGER_PROJECT_REF
        sync: false
